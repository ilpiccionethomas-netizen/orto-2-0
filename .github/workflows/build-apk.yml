name: Compila APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installa dipendenze e sincronizza Capacitor
        run: |
          npm install
          npx cap sync android

      - name: Dai permessi di esecuzione a Gradle
        run: chmod +x android/gradlew

      - name: Compila APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Carica l'APK come file scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: Orto-2.0-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
