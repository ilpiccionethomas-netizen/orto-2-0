name: Genera APK Orto 2.0

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica i file del progetto
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configura Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Crea package.json e installa Capacitor
        run: |
          rm -f www/placeholder.txt
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Orto 2.0" "com.orto.app" --web-dir www
          npx cap add android

      - name: Aggiungi permessi GPS per meteo
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" \/>\n<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>\n<application/' android/app/src/main/AndroidManifest.xml

      - name: Compila APK con Java 21
        run: |
          echo "org.gradle.java.home=$JAVA_HOME_21_X64" >> android/gradle.properties
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Carica APK pronto
        uses: actions/upload-artifact@v4
        with:
          name: Orto-2.0-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
